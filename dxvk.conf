# Reglages DXVK de la pile ouverte.
#
# d3d9.enumerateByDisplays : DXVK, compile en PE Windows, construit par defaut
# ses adaptateurs Direct3D 9 a partir des ecrans rendus par EnumDisplayDevices.
# Sous notre Wine aucun ecran n'est signale comme attache au bureau, donc zero
# adaptateur : GetDeviceCaps rend D3DERR_INVALIDCALL et le jeu refuse de
# demarrer (mesure sur Legend of Grimrock). Desactive, DXVK enumere directement
# les adaptateurs Vulkan.
d3d9.enumerateByDisplays = False
