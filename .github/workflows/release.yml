# Reconstruit la pile depuis les sources sur un runner macOS Apple Silicon et
# empaquette le runtime. A LANCER A LA MAIN (onglet Actions) : le build est lourd
# (plusieurs heures) et n'a encore jamais abouti sur CI.
#
# Il ne se declenche plus sur un tag. Les releases sont publiees depuis la
# machine ou le build existe (tests/publier_release.sh) ; un tag lancait ce build
# non eprouve, qui echouait -- ou qui, en reussissant, aurait remplace les
# archives deja publiees par d'autres, jamais essayees.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version du runtime a construire, sans le v (ex. 1.2.0)"
        required: true
      publier:
        description: "Attacher les archives a la release v<version> (sinon : artefact du run)"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  construire:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Outils de build (arm64)
        run: |
          brew install meson ninja cmake glslang spirv-tools llvm zstd bison autoconf automake libtool pkg-config nasm || true
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
      - name: Toolchain (llvm-mingw)
        run: sh tests/etape0_toolchain.sh
      - name: Sources + patches
        run: |
          sh tests/etape1_appliquer_correctifs.sh --cloner
          sh tests/etape1_appliquer_correctifs.sh
      - name: FEX
        run: sh tests/construire_fex.sh --installer
      - name: Pile arm64 (Mesa, Wine, DXVK)
        run: sh tests/construire_pile_arm64.sh
      - name: Empaqueter le runtime
        env:
          CIDRE_VERSION: ${{ inputs.version }}
        run: sh tests/empaqueter_runtime.sh "$GITHUB_WORKSPACE/cidre-runtime.tar.zst"
      - name: Garder les archives (artefact du run)
        if: ${{ !inputs.publier }}
        uses: actions/upload-artifact@v4
        with:
          name: cidre-runtime-${{ inputs.version }}
          path: |
            cidre-runtime.tar.zst
            cidre-runtime.tar.xz
      - name: Publier la release
        if: ${{ inputs.publier }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          files: |
            cidre-runtime.tar.zst
            cidre-runtime.tar.xz
          fail_on_unmatched_files: true
