# Dead Cells (HashLink/SDL2, binaire 32 bits). CPU/traduction-bound (GPU ~20-25 %,
# inoccupe) : mesure en jeu 75 fps -> 110 fps avec tso off (+47 %), chargement
# aussi bien plus rapide. Peu sensible aux courses en pratique, teste lisse. Si
# bug, tso = true.
[jeu]
appid = 588650
nom = "Dead Cells"
exe = "deadcells.exe"
moteur = "hashlink"
api = "d3d11"
bits = 32
anticheat = "none"
lanceur = "steam"

[cidre]
tso = false
# Jeu 32 bits : rendu par defaut (DXMT) des que le runtime porte la variante i386
# (dxmt/i386, patch 0123), sinon le lanceur le met de lui-meme en DXVK. Le « DXError
# 887A0004 » du 2026-10-13 n'etait pas DXMT : sans variante i386, c'est le d3d11
# builtin de Wine qui refusait (tests/sonde_heaps.sh). L'ecran noir de la premiere
# manche DXMT i386 venait du plein ecran exclusif du Wine d'avant 0122.

[compat]
etat = "or"
source = "cidre-test"
date = "2026-10-13"
machine = "M1 Max 32 Go"
cidre_version = ""
fps_menu = 0
fps_jeu = 120
notes = "DXMT i386 : 120 fps et 2 ms au HUD en plein ecran (Wine avec 0122), partie chargee. DXVK : 110 fps avec tso = false, 75 avec TSO. DRM Valve porte."

[compat.steam_cloud]
methode = "api"
synchro = "steam-api"
source = "steam"
date = "2026-10-13"
