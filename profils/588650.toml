# Dead Cells (HashLink/SDL2, binaire 32 bits). CPU/traduction-bound (GPU ~20-25 %,
# inoccupe) : mesure en jeu 75 fps -> 110 fps avec tso off (+47 %), chargement
# aussi bien plus rapide. Peu sensible aux courses en pratique, teste lisse. Si
# bug, tso = true.
[jeu]
appid = 588650
nom = "Dead Cells"
exe = "deadcells.exe"
moteur = "hashlink"
api = "opengl"
bits = 32
anticheat = "none"
lanceur = "steam"

[cidre]
tso = false
# Jeu 32 bits. Le « DXError 887A0004 » du 2026-10-13 n'etait pas DXMT : sans
# variante i386, c'est le d3d11 builtin de Wine qui refusait (tests/sonde_heaps.sh).
# Avec DXMT i386 (patch 0123) le jeu demarre et rend, mais la manche du 2026-10-13
# (Wine d'avant 0122) est restee sur un ecran noir en plein ecran exclusif ; pas
# reproduit a la sonde sur le Wine d'apres. DXVK (110 fps) tant qu'une manche n'a
# pas montre l'image et les fps en DXMT.
d3d11 = "dxvk"

[compat]
etat = "or"
source = "cidre-test"
date = "2026-09-20"
machine = "M1 Max 32 Go"
cidre_version = ""
fps_menu = 0
fps_jeu = 110
notes = "75 fps par defaut, 110 avec tso = false. DRM Valve porte, plein ecran OK."

[compat.steam_cloud]
methode = "api"
synchro = "steam-api"
source = "steam"
date = "2026-10-13"
