# Little Nightmares Enhanced Edition -- fiche amorcee par tests/outils/importer_profils.py (2026-10-11).
# Chaque valeur importee porte sa source et sa date ([jeu.sources], ou `source`/`date`
# des blocs [compat.*]) ; une valeur sans provenance, cidre-test ou utilisateur n'est
# jamais ecrasee par l'import. Voir profils/README.md.

[jeu]
appid = 2149010
nom = "Little Nightmares Enhanced Edition"
plateformes_steam = "windows"
moteur = "unreal"
moteur_nom = "Unreal Engine 4"
api = "d3d12"
api_disponibles = "d3d12"
bits = 64
drm = "steam"

[jeu.sources]
nom = "steam 2026-10-11"
plateformes_steam = "steam 2026-10-11"
moteur = "pcgamingwiki 2026-10-11"
moteur_nom = "pcgamingwiki 2026-10-11"
api = "pcgamingwiki 2026-10-11"
api_disponibles = "pcgamingwiki 2026-10-11"
bits = "pcgamingwiki 2026-10-11"
drm = "pcgamingwiki 2026-10-11"

[cidre]
dx12 = true

# Resolution redetectee une fois. Au premier lancement (ResolutionSizeX/Y a 0),
# Unreal prend la definition native du moniteur dans son EDID ; avant le
# correctif winemac de l'EDID (mode emule), c'etait celle de la dalle Retina
# (3456x2234 sur un MacBook Pro 16") et le jeu rendait 4 fois plus de pixels que
# l'espace n'en montre (12 fps contre 75 en 1728x1084, M1 Max, 2026-10-14). Remis
# a 0, il redetecte la taille de l'espace. Ne vaut qu'avec ce correctif.
[[reglages_jeu]]
id = "resolution-edid"
fichier = "AppData/Local/Little Nightmares Enhanced Edition/Saved/Config/WindowsNoEditor/GameUserSettings.ini"
format = "ini"
section = "/Script/Engine.GameUserSettings"
valeurs = { "ResolutionSizeX" = "0", "ResolutionSizeY" = "0", "LastUserConfirmedResolutionSizeX" = "0", "LastUserConfirmedResolutionSizeY" = "0" }

[compat]
etat = "argent"
source = "cidre-test"
date = "2026-10-14"
machine = "M1 Max 32 Go"
fps_jeu = 29
notes = "Jeu D3D12 seul : dx12 = true (vkd3d-proton -> KosmicKrisp). Sans custom_border et avec les correctifs KosmicKrisp 0135, 0136 et 0138 (actifs avec dx12), 29 fps / 33 ms a la vue de test du premier niveau (12 fps / 77 ms avant) ; image correcte. Limite par le GPU : filtres de calcul et passes plein ecran. Correctifs 0136/0138 verifies sur M1 Max / macOS 26 seulement."

