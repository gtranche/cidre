# PEAK (Unity 6, D3D12 avec repli D3D11). dx12 = false : le D3D11 par DXMT est
# bien plus rapide. Le vrai D3D12 marche depuis le 2026-10-14 (vkd3d-proton,
# KosmicKrisp 0127 pour les textures sparse, DXGI de DXVK, -force-d3d12) : meme vue,
# 32 images/s (23 ms GPU) par defaut, 45 images/s avec -force-gfx-direct (Unity rend
# alors en 2 listes de commandes par image au lieu de ~120, que KosmicKrisp coupe
# chacune en passes), contre 105 images/s (10 ms GPU) en DXMT. Reste en D3D12 un gel
# au changement d'espace macOS (bascule plein ecran d'Unity). Pour essayer :
# CIDRE_DX12=1 et les arguments -force-d3d12 -force-gfx-direct.
#
# tso_sans = "UnityPlayer.dll" : avec l'emulation de l'ordre memoire x86 (TSO) de
# FEX, regarder au loin fait tomber le jeu de ~100 a 13 images/s (mesure du 2026-10-13, M1 Max,
# reproduit sur quatre lancements). Ce n'est ni la carte graphique (occupee a 13 %,
# ~10 ms par image) ni le chemin par dessin de DXMT (fil d'encodage inoccupe a
# 97 %) : a l'horizon la scene passe de 350 a 2 100 dessins et le fil de rendu
# d'Unity attend ses fils de travail (Job.Worker), qui passent leur temps dans une
# meme famille de fonctions de UnityPlayer.dll (+0x1522d00 a +0x15246a0, perf map
# FEX), tres lentes sous TSO. Aucune option graphique du jeu n'y change rien
# (ombres, qualite du monde, occlusion ambiante, echelle de rendu, toutes
# baissees : 13-14 images/s), -force-gfx-mt non plus. Sans TSO du tout (tso =
# false, la fiche jusqu'au 19/10) : 72 images/s au meme endroit.
# Depuis FEX 0179 (Cidre 1.5.16), seul UnityPlayer.dll est exempte du TSO ; Mono
# (mono-2.0-bdwgc et son JIT), Burst et les autres DLL le gardent, et dans
# UnityPlayer.dll meme les 16 435 acces que MSVC dit volatils aussi. Manche du
# 2026-10-19 (M1 Max, au loin, 4 300-6 600 dessins par image) : TSO 13,6 images/s ;
# tso_sans UnityPlayer.dll 83,3, puis 80,9 en moyenne sur 8 min (78,6-84,2 par
# tranche de 10 s, pas de gel, pas de plantage) ; tso_msvc (metadonnee MSVC prise
# au mot dans tous les modules) 81,0. Le journal le dit : « TSO par module :
# UnityPlayer.dll ... (exempte) » avec FEX_SILENTLOG=0. Si le jeu se fige ou
# plante : `cidre set 3527290 tso false` (sans TSO du tout, l'ancien reglage).
# Les options graphiques du jeu sont des PlayerPrefs d'Unity (registre du
# prefixe, HKCU\Software\LandCrab\PEAK : RenderScaleSetting,
# ShadowDistanceSettings, LodQuality, AOSetting).
[jeu]
appid = 3527290
nom = "PEAK"
exe = "PEAK.exe"
moteur = "unity"
api = "d3d12"
bits = 64
anticheat = "none"
lanceur = "steam"

[cidre]
dx12 = false
tso_sans = "UnityPlayer.dll"
# async = true : en DXMT, un dessin dont le pipeline compile encore est saute au
# lieu de geler l'image (d3d11.asyncPipelines, correctif 0152). Manche du
# 2026-10-16 (M1 Max, cache de shaders vide) : sans, 2 ou 3 ralentissements au
# debut ; avec, aucun, rien ne manque, pas de plantage.
async = true

[compat]
etat = "or"
source = "cidre-test"
date = "2026-10-19"
machine = "M1 Max 32 Go"
cidre_version = "1.5.16"
fps_menu = 0
fps_jeu = 81
notes = "En D3D11 (repli du DX12) avec DXMT, TSO de FEX actif sauf dans UnityPlayer.dll (tso_sans) : 81 fps en regardant au loin (8 min stables), ~100 fps de pres, plein ecran, options du jeu d'origine. Sans TSO du tout (tso = false) : 72 fps au loin. Avec le TSO partout : 13 fps au loin (fils de travail d'Unity ralentis par l'emulation, GPU occupe a 13 %), quelles que soient les options graphiques du jeu. En DXVK (jusqu'a la 1.5.7) : 8-15 fps partout. Le vrai D3D12 (dx12 = true) fige en jeu (tiled resources)."

[compat.steam_cloud]
methode = "auto"
synchro = "steam-lien"
racine_windows = "WinAppDataLocalLow/LandCrab/PEAK"
motifs = "*.peak"
dossier_windows = "AppData/LocalLow/LandCrab/PEAK"
racine_macos = "MacAppSupport/unity.LandCrab.PEAK"
partage = "par-plateforme"
liens = "AppData/LocalLow/LandCrab/PEAK => Library/Application Support/unity.LandCrab.PEAK"
source = "steam"
date = "2026-10-13"
