# Warhammer: Vermintide 2. LuaJIT veut la fenetre basse (sinon plantage au boot).
# Fils compilateurs limites : a 10 (tous les coeurs) le gros chargement du Donjon
# affame le fil principal 16 s et le chien de garde du jeu tue le process.
# Steam demande launcher/Launcher.exe (.NET) : outil-steam/jeux.conf le remplace
# par binaries/vermintide2.exe.
[jeu]
appid = 552500
nom = "Warhammer: Vermintide 2"
exe = "binaries/vermintide2.exe"
moteur = "stingray"
api = "d3d11"
bits = 64
anticheat = "eac"
lanceur = "steam"

[cidre]
luajit = true
async = true
narrow_barriers = true
fils_compilation = 4
eac_untrusted = true

[compat]
etat = "argent"
source = "cidre-test"
date = "2026-09-28"
machine = "M1 Max 32 Go"
cidre_version = ""
fps_menu = 0
fps_jeu = 0
notes = "Jouable en Modded Realm (-eac-untrusted) : EAC en ligne est un mur. Donjon en 1re personne joue."

[compat.steam_cloud]
methode = "api"
synchro = "steam-api"
source = "steam"
date = "2026-10-13"
