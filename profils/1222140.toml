# Detroit: Become Human (Quantic Dream, Vulkan natif). Mesure sur iMac M4 (macOS 27.0.1),
# runtime 1.5.12 + pilote KosmicKrisp de main (0163-0168), le 2026-10-16 :
#   - premier lancement : le jeu precompile toute sa liste de pipelines (99 453 pipelines,
#     151 182 bibliotheques MSL, ~11 min de creation de pipelines apres ~25 min de MSL la
#     toute premiere fois) ; MTLCompilerService sature (600-900 % de CPU), c'est attendu ;
#     avec la reserve d'AIR locale (0171) pleine, ~6 min sans compilation Metal ;
#   - sans 0164 : 111 bibliotheques refusees (« thread_index_in_simdgroup » en vertex) et
#     l'ecran restait a 98 % ; sans 0166 : VkPipelineCache.bin a 0 octet + CorruptedCache,
#     98 % sans fin ; avec les deux : cache de 1,31 Go ecrit, le jeu arrive en jeu ;
#   - sans 0168 : arret par Metal en jeu apres un changement de qualite (melange natif sur
#     une cible R32Uint) ;
#   - 30 fps pile en jeu : FIFO a la demi-cadence (vsync = true par defaut), comme DREDGE ;
#     vsync = false (choix du joueur), gain pas encore mesure sur ce jeu.
# PAS d'identite de carte (vk_identite), le 2026-10-17 : annoncee en RX 580, le jeu prend sa
# voie AMD (type 2, DetroitBecomeHuman.exe+0x6625aa) et ses personnages se deforment (yeux et
# costume « qui sortent ») ; en Apple, voie generique (type 0), image juste. Le prix : a chaque
# lancement, le jeu affiche « carte graphique inconnue » (OK/Annuler ; Annuler quitte) -- cliquer
# OK. Une identite NVIDIA passerait par une 3e voie (type 1) et un controle du pilote >= 445.87
# sur une chaine de version que nous ne maitrisons pas : non essayee.
# Arret en jeu au bout de 6 a 15 min (code 5, acces refuse, minidumps du jeu dans son dossier) :
# l'allocateur MMDQ du jeu reserve ses arenes de 1 Gio a 1, 2, 3 Gio et suppose leur base
# alignee ; Wine/macOS (base sous 4 Gio traitee en preference) en rendait une non alignee, le
# commit des blocs echouait, le jeu ecrivait quand meme -- correctif Wine en attente de numero.
[jeu]
appid = 1222140
nom = "Detroit: Become Human"
exe = "DetroitBecomeHuman.exe"
moteur = "autre"
api = "vulkan"
bits = 64
anticheat = "none"
lanceur = "steam"

[cidre]
# En jeu, 30 fps pile : la vsync FIFO (defaut) tombe a la demi-cadence des qu'une image
# depasse 16,7 ms a 60 Hz. Sans vsync, le jeu peut monter au-dessus de 30, au prix de
# dechirures (choix du joueur, 2026-10-16 ; gain pas encore mesure sur ce jeu).
vsync = false
# Synchro Wine en process (0103, par defaut depuis la v1.5.16) coupee : avec elle, en jeu, une
# image toutes les deux secondes (0,5 fps, GPU a 4 %, fils en attente : reveil perdu puis delai
# depasse) ; sans elle, 50 a 57 fps en 2240x1260, affichage direct (iMac M4, v1.5.17,
# 2026-10-20). Le menu restait fluide dans les deux cas. Cause dans 0103 a trouver.
sync_local = false

[compat]
etat = "bronze"
source = "cidre-test"
date = "2026-10-17"
machine = "iMac M4"
cidre_version = "1.5.15 (KosmicKrisp 0164-0173)"
fps_menu = 0
fps_jeu = 21
notes = "Vulkan natif. Premier lancement tres long (precompilation de 99 453 pipelines, cache Vulkan de 1,31 Go ensuite). Avertissement « carte graphique inconnue » a chaque lancement : cliquer OK (une identite AMD deforme les personnages). Arret en jeu apres 6 a 15 min tant que le correctif Wine d'alignement des reservations n'est pas livre. 21 fps en jeu, GPU a 98 %."
voie = "natif"
