[jeu.sources]
nom = "steam 2026-10-11"
plateformes_steam = "steam 2026-10-11"
moteur = "pcgamingwiki 2026-10-11"
moteur_nom = "pcgamingwiki 2026-10-11"
api = "pcgamingwiki 2026-10-11"
api_disponibles = "pcgamingwiki 2026-10-11"
bits = "pcgamingwiki 2026-10-11"
drm = "pcgamingwiki 2026-10-11"

# Classe D3D12 seul par PCGW, mais le binaire (SH9/Binaries/Win64/SHCO.exe) a aussi
# le rendu D3D11 d'Unreal 4 : -d3d11 le fait tourner en DXMT (rapport ProtonDB
# « %command% -d3d11 »). Ses videos de demarrage et cinematiques sont des .mp4
# lus par Media Foundation : il faut le GStreamer du runtime (winegstreamer), sans
# quoi le jeu reste sur un ecran noir (2026-10-15).
[cidre]
arguments = "-d3d11"
dx12 = false

# Charge equivalente au Deck (etude-proton.md, 2026-10-16) : definition interne a
# 50 %, comme Expedition 33 et Still Wakes the Deep. A 1728x1084 (sortie du mode
# emule), 50 % rendent 0,47 Mpx, ce que rend le Deck en 1280x800 avec FSR qualite
# (67 %, 0,46 Mpx) ; Still Wakes : 20 -> 50 fps de 100 a 50 %. Le jeu passe par
# FSR (bUseFSR=True) : il lit FSRScreenPercentagePreset, et garde la meme valeur
# dans sg.ResolutionQuality. Releve dans le prefixe le 2026-10-16 : 75 et 75.
# Les qualites (sg.*Quality) restent celles du jeu et du joueur. Pose une fois (id).
[[reglages_jeu]]
id = "definition-50"
fichier = "AppData/Local/SH9/Saved/Config/WindowsNoEditor/GameUserSettings.ini"
format = "ini"
section = "ScalabilityGroups"
valeurs = { "sg.ResolutionQuality" = "50.000000" }

[[reglages_jeu]]
id = "definition-50-fsr"
fichier = "AppData/Local/SH9/Saved/Config/WindowsNoEditor/GameUserSettings.ini"
format = "ini"
section = "/Script/Engine.GameUserSettings"
valeurs = { "FSRScreenPercentagePreset" = "50.000000" }

[compat]
etat = "bronze"
source = "cidre-test"
date = "2026-10-15"
machine = "M1 Max 32 Go"
fps_jeu = 20
notes = "Ecran noir en entrant dans la partie : la cinematique d'ouverture (Movies/Win64/CordonaIntro_CS.mp4, H.264) ne jouait pas, Wine etant bati sans GStreamer. Avec winegstreamer (tests/construire_gstreamer.sh) elle joue et la partie demarre (voie D3D12, 20 fps, reglages du jeu). Changer la definition dans le menu (1496x967) faisait sortir le jeu sur une assertion de win32u (make_ratio, sysparams.c) : correctif wine11 0149. La voie D3D11 (-d3d11, DXMT) rendait le menu ; partie a mesurer."

