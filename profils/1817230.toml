# Classe D3D12 seul par PCGW, mais le binaire a aussi le rendu D3D11 d'Unreal 4 :
# avec -dx11 il tourne en DXMT (M1 Max, 2026-10-15). Denuvo n'a rien bloque.
[cidre]
arguments = "-dx11"
dx12 = false

