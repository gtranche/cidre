notes = "Unreal 4 en D3D11 (arguments -dx11, DXMT). L'amorceur Hi-Fi-RUSH.exe lance Hibiki/Binaries/Win64/Hi-Fi-RUSH.exe sans aide ; Denuvo ne bloque pas. En jeu, reglages par defaut (Epique, 100 %) : 60 fps / 10 ms, soit le plafond du jeu (FrameRateLimit=60). Reglages : Saved Games/TangoGameworks/Hi-Fi RUSH (STEAM)/Saved/Config/WindowsNoEditor/GameUserSettings.ini (pas sous AppData/Local/Hibiki, qui ne garde qu'un fichier de session)."

