# Fahrenheit: Indigo Prophecy Remastered -- fiche amorcee par tests/outils/importer_profils.py (2026-10-13).
# Chaque valeur importee porte sa source et sa date ([jeu.sources], ou `source`/`date`
# des blocs [compat.*]) ; une valeur sans provenance, cidre-test ou utilisateur n'est
# jamais ecrasee par l'import. Voir profils/README.md.

[jeu]
appid = 312840
nom = "Fahrenheit: Indigo Prophecy Remastered"
plateformes_steam = "macos windows"
api_disponibles = "d3d9 opengl"
bits = 32
drm = "steam"
# Le jeu lui-meme, pas le lanceur Qt d'Aspyr (Fahrenheit.exe) : celui-ci range ses DLL
# (Qt5, SDL2, libgcc) dans Fahrenheit.exe.local\, redirection que Wine ignore
# (c0000135, code 53). Le lanceur ne montre que l'EULA et les actualites.
exe = "FahrenheitSub.exe"
mac_32bits = true

[jeu.sources]
nom = "steam 2026-10-13"
plateformes_steam = "steam 2026-10-13"
api_disponibles = "pcgamingwiki 2026-10-11"
bits = "pcgamingwiki 2026-10-11"
drm = "pcgamingwiki 2026-10-11"
mac_32bits = "steam 2026-10-16"

[cidre]
dependances = "vcrun2005"
# D3D9 par DXVK i386 (KosmicKrisp) : avec le d3d9 builtin de Wine (wined3d sur
# l'OpenGL de macOS), Direct3DCreate9 rendait NULL -- « Failed to create Direct3D
# object » au demarrage (M4, 2026-10-16). Le plein ecran 1024x768 du jeu passe par
# le mode emule (mode_emule, a garder : sans lui le jeu demande une definition
# absurde) et demande Wine 0169 (chaine pNext de la swapchain).
d3d9 = "dxvk"
# Le jeu sort sur le code 1 a chaque fermeture par son menu, apres avoir vide ses
# pools memoire et sauvegarde (« Setting breakpad minidump AppID = 312840 » juste
# avant ; M4, 2026-10-19) : fin normale, pas d'alerte dans Verger. Un code 1 dans
# la premiere minute reste une erreur (sortie_normale_apres, 60 s par defaut).
sortie_normale = "1"

[cidre.sources]
dependances = "crossover 2026-10-13"
sortie_normale = "cidre-test 2026-10-19"

