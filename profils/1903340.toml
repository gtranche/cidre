# Clair Obscur: Expedition 33 (Unreal Engine 5, D3D11). Mesure sur M1 Max,
# reglages du jeu au maximum, zone d'ouverture :
#   - sans rien : ~5 min de chargement, 4 images/s, puis 0,6 quand la scene
#     se charge de dessins indirects ;
#   - async + 6 fils : dans l'intro en ~2 min 40 (la compilation des pipelines
#     quitte le fil de commandes de DXVK) ;
#   - garde_index = false : 15 images/s au meme endroit. Le fil de commandes ne
#     lance plus une passe de calcul par dessin indirect ; il reste limite par
#     la carte graphique. Image verifiee par le joueur sur cette zone seulement.
# Le 2026-10-11, avec le prereglage Moyen du jeu et la resolution a 66 % :
#   DXVK (d3d11 = "dxvk") : menu 12 fps, jeu 4 ; DXMT (d3d11 = "dxmt") : menu 90, jeu 38-43.
[jeu]
appid = 1903340
nom = "Clair Obscur: Expedition 33"
exe = "Expedition33_Steam.exe"
moteur = "unreal"
api = "d3d11"
bits = 64
anticheat = "none"
lanceur = "steam"
[cidre]
async = true
fils_compilation = 6
garde_index = false
# DXMT (D3D11 -> Metal en un saut) : x3-4 sur DXVK sur ce jeu (mesure ci-dessus),
# valide sur M1 Max (macOS 26) et M4 (macOS 27, 2026-10-12). Sans vsync (le FIFO
# plafonne les fps sous la frequence de l'ecran) ni TSO (l'ordre memoire x86 emule
# coute jusqu'a x3 sur le CPU ; pas de course vue sur ce jeu).
d3d11 = "dxmt"
vsync = false
tso = false
# Tests de borne des tampons groupes par element (correctif DXMT 0121) : -7 a
# -10 % sur les vertex shaders de la passe de base au banc (2026-10-13), sous le
# bruit en fps. Recompile les shaders une fois au premier lancement.
dxmt_config = "d3d11.groupedBufferLoad=True"

# Reglages du jeu, poses une fois par le lanceur ; l'utilisateur est libre ensuite
# (voir README). Ou le jeu lit quoi (mesure sur M1 Max le 2026-10-11 et sur iMac M4
# le 2026-10-12) :
#   - la resolution : CurrentSelectedUpscalerQualityMode dans l'INI (0 -> 50 %,
#     1 -> 75, 2 -> 85, 3 -> 100) ; sg.ResolutionQuality en est recalcule ;
#   - la qualite (Bas 0, Moyen 1, Eleve 2, Epique 3) : dans sa sauvegarde de
#     reglages SharedGameUserSettings.sav, PAS dans l'INI -- au demarrage il recopie
#     la sauvegarde sur tous les sg.*Quality de l'INI (des sg.* poses a 0 reviennent
#     a 1 et le jeu tourne en Moyen). D'ou le format gvas plus bas ;
#   - la taille de fenetre : ResolutionSizeX/Y sont reecrits par le jeu (384x2520
#     sous Wine) ; le mode fenetre (FullscreenMode=2) donne une fenetre inutilisable.
# Reference : resolution a 50 % (decision du 2026-10-11 avec l'utilisateur, le 50 %
# gagne nettement), qualite Moyen. C'est aussi le meilleur reglage sur l'iMac M4
# (10 coeurs GPU, 2240x1260 points), en jeu, meme scene :
#     Moyen 75 % (ce que le jeu choisit seul en DXMT)   22 fps   GPU 47 ms
#     Moyen 50 %                                        35 fps   GPU 30 ms
#     Bas   50 %                                        37 fps   GPU 28 ms
#     Moyen 50 % + metalfx = true                       30 fps   GPU 37 ms
# Le Bas n'achete que 5 % (et il est moche) : on reste en Moyen partout. MetalFX
# coute 7 ms sur cette carte (sortie 4480x2520) : metalfx reste a false.
[[reglages_jeu]]
fichier = "AppData/Local/Sandfall/Saved/Config/Windows/GameUserSettings.ini"
format = "ini"
section = "/Script/SandFall.ConfigurableGameUserSettings"
valeurs = { "CurrentSelectedUpscalerQualityMode" = "0" }

# Le jeu refait sa detection du materiel quand cette cle change -- la carte vue
# n'est pas la meme en DXVK et en DXMT -- et remet alors qualite et resolution a
# ses propres valeurs, une minute apres le lancement (Moyen 75 % en DXMT, Bas 75 %
# en DXVK sur l'iMac M4). Le lanceur la releve avant et apres la partie : si elle
# a change, les reglages ci-dessus sont reposes au lancement suivant.
[reglages_jeu_temoin]
fichier = "AppData/Local/Sandfall/Saved/Config/Windows/GameUserSettings.ini"
cle = "UserConfigHardwareProfile"

# La qualite Moyen, la ou le jeu la lit. Vraie sur toute machine : la condition
# ne sert qu'a ranger l'entree dans un bloc [[machine]], qu'un runtime d'avant le
# format gvas (Cidre <= 1.5.4) ignore -- il reessaierait cette entree a chaque
# lancement sans jamais noter les reglages comme poses. Sans ce bloc la qualite
# est celle que le jeu choisit seul : Moyen en DXMT sur M1 Max comme sur M4.
[[machine]]
si = "coeurs_gpu >= 1"
[[machine.reglages_jeu]]
fichier = "AppData/Local/Sandfall/Saved/SaveGames/*/SharedGameUserSettings.sav"
format = "gvas"
[machine.reglages_jeu.valeurs]
"OverallScalabilityLevel" = "1"
"ViewDistanceQuality" = "1"
"AntiAliasingQuality" = "1"
"ShadowQuality" = "1"
"GlobalIlluminationQuality" = "1"
"ReflectionQuality" = "1"
"PostProcessQuality" = "1"
"TextureQuality" = "1"
"EffectsQuality" = "1"
"FoliageQuality" = "1"
"ShadingQuality" = "1"

[compat]
etat = "argent"
source = "cidre-test"
date = "2026-10-11"
machine = "M1 Max 32 Go"
cidre_version = "1.5.0"
fps_menu = 130
fps_jeu = 52
notes = "DXMT (d3d11 = dxmt), prereglage Moyen + resolution 50 % (CurrentSelectedUpscalerQualityMode=0) : menu ~130 fps, jeu 50-55. A 66 % : menu 90, jeu 38-43. DXVK au meme endroit (66 %) : menu 12, jeu 4. Overlay Steam coupe en DXMT (fige la presentation)."
voie = "dxmt"

# La compatibilite par famille de Mac (voir README, « Compatibilite par famille
# de Mac »). Le D3D12 d'Unreal 5 (Nanite) demande le Shader Model 6.6, donc les
# atomiques 64 bits min/max que Metal n'offre qu'a partir de la famille Apple8
# (M2) : option sm66, lot 0142-0146, Cidre 1.5.11. Il demarre sur le M4 mais y
# fait 19 fps la ou DXMT en fait 35 : la fiche reste en DXMT partout, et
# n'active pas dx12/sm66 par un bloc [[machine]] (il suffirait de
#     [[machine]]
#     si = "famille_gpu >= 8"
#     [machine.cidre]
#     dx12 = true
#     sm66 = true
# le jour ou le D3D12 passera devant).
[[compat.machines]]
nom = "M1"
si = "famille_gpu <= 7"
voie = "d3d12"
etat = "ko"
source = "cidre-test"
date = "2026-10-15"
machine = "M1 Max 32 Go"
cidre_version = "1.5.11"
options = "dx12=true sm66=true"
notes = "Unreal refuse le D3D12 (« DirectX 12 is not supported ») : la carte n'a pas les atomiques 64 bits min/max que Nanite exige (Metal : famille Apple8, M2, et suivantes). Rester en DXMT."

[[compat.machines]]
nom = "M2 et suivants"
si = "famille_gpu >= 8"
voie = "dxmt"
etat = "argent"
source = "cidre-test"
date = "2026-10-12"
machine = "iMac M4 24 Go (10 coeurs GPU, ecran 4480x2520)"
cidre_version = "1.5.3"
fps_menu = 77
fps_jeu = 35
notes = "DXMT sans vsync ni TSO, Moyen + resolution 50 % : menu 72-80 fps, jeu 33-37 (GPU 30 ms, carte a 99 %). Mesure sur M4 ; M2 et M3 non essayes."

[[compat.machines]]
nom = "M2 et suivants"
si = "famille_gpu >= 8"
voie = "d3d12"
etat = "bronze"
source = "cidre-test"
date = "2026-10-15"
machine = "iMac M4 24 Go (10 coeurs GPU)"
cidre_version = "1.5.11"
fps_jeu = 19
options = "dx12=true sm66=true"
notes = "Unreal accepte le D3D12 en SM 6.6 et va en jeu : 19 fps / 50 ms en Bas 50 %, carte a 93-99 %, contre 35 fps en DXMT (Moyen 50 %). Mesure sur M4 ; M2 et M3 non essayes."

[[rapports]]
date = "2026-10-12"
machine = "iMac M4 24 Go (10 coeurs GPU, ecran 4480x2520)"
cidre_version = "1.5.3"
etat = "argent"
fps_menu = 77
fps_jeu = 35
notes = "DXMT sans vsync ni TSO, Moyen + resolution 50 % : menu 72-80 fps, jeu 33-37 (GPU 30 ms, carte a 99 %). Moyen 75 % : menu 42, jeu 22. Bas 50 % : menu 84, jeu 37. Moyen 50 % + MetalFX : menu 62, jeu 30. Eleve 50 % : menu 70. Memoire : 4,7 Go pour le jeu, 6 Go alloues par la carte, pas de swap. En DXVK le jeu se regle seul en Bas."

