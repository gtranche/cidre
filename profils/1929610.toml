# Demonologist -- fiche amorcee par tests/outils/importer_profils.py (2026-10-11).
# Chaque valeur importee porte sa source et sa date ([jeu.sources], ou `source`/`date`
# des blocs [compat.*]) ; une valeur sans provenance, cidre-test ou utilisateur n'est
# jamais ecrasee par l'import. Voir profils/README.md.

[jeu]
appid = 1929610
nom = "Demonologist"
plateformes_steam = "windows"

[jeu.sources]
nom = "steam 2026-10-11"
plateformes_steam = "steam 2026-10-11"

# M2 et suivants : le vrai D3D12 en Shader Model 6.6 eclaire les pieces. Unreal 5.6
# y active Lumen, seul a eclairer les pieces par leurs neons emissifs (sur M1, sans
# SM 6.6 ni atomiques 64 bits, elles restent noires en DXMT comme en D3D12). Mesure
# sur l iMac M4 (10 coeurs GPU) le 2026-10-16, meme piece :
#     DXMT (defaut)                                      pieces aux neons noires
#     D3D12, reglages par defaut, 2240x1260              8 fps   GPU 113 ms
#     D3D12, tout au minimum, 1600x900, FSR Ultra Perf. 18 fps   GPU  55 ms
#     idem + generation d images FSR 3                  32 fps affiches (~16 reels)
# Pas active par defaut : decision de l utilisateur le 2026-10-16 (DXMT partout,
# trop lent en D3D12 sur un M4 de base). Pour l activer sur M2 et suivants :
#     cidre set 1929610 dx12 true
#     cidre set 1929610 sm66 true
#     cidre set 1929610 arguments -dx12      (sans -dx12 le jeu reste en D3D11)
# puis, dans le menu du jeu : tout au minimum (l Illumination globale ne descend
# pas sous Elevee, ce qui garde Lumen), FSR Ultra Performance, sortie 1600x900, et
# au besoin la generation d images. Ces reglages vivent dans
# Saved/SaveGames/OptionsRelease.sav (structure GraphicQuality, UpscalingMethod,
# FSRFrameGenMode), absente d une sauvegarde neuve et d un en-tete Unreal 5.6 que
# le format gvas ne sait pas completer : une fiche ne peut pas les poser.
#
# M1 (famille_gpu <= 7) : D3D12 + SM 6.6 par defaut, avec Lumen allege. Les
# atomiques 64 bits y sont emulees (KosmicKrisp 0153) et une barriere de calcul
# qui precede une lecture d arguments indirects ferme l encodeur (0155). Mesure
# au menu (scene eclairee, meme cout que le jeu), M1 Max, 1728x1084, le 2026-10-18 :
#     D3D12 + Lumen, reglages du jeu                    19,9 fps  GPU ~50 ms
#     + Lumen allege (Engine.ini ci-dessous)            26,9 fps  GPU  37 ms
#     Lumen coupe (pieces noires, pour memoire)         30,8 fps  GPU  29 ms
# Le jeu impose sa definition et son pourcentage de rendu (GameUserSettings et
# r.ScreenPercentage sans effet) : seules les variables r.Lumen.* portent. Le
# jeu n ecrit pas d Engine.ini : la fiche le cree (creer = true).
# Ne pas mesurer avec le HUD Metal (hud = true) : en D3D12 il fige une partie
# sur deux a 0,9 image/s.

[[machine]]
si = "famille_gpu <= 7"
[machine.cidre]
dx12 = true
sm66 = true
arguments = "-dx12"
[[machine.reglages_jeu]]
# Lumen allege : sondes de l ecran deux fois plus espacees, octaedre 6, sans AO
# courte portee ni volume de translucidite, radiosite espacee, sans SDF de
# maillage, sans reflexions Lumen, cache de surface rafraichi au 1/16.
id = "lumen-m1-allege"
fichier = "AppData/Local/Shivers/Saved/Config/Windows/Engine.ini"
section = "SystemSettings"
creer = true
[machine.reglages_jeu.valeurs]
"r.Lumen.ScreenProbeGather.DownsampleFactor" = "32"
"r.Lumen.ScreenProbeGather.TracingOctahedronResolution" = "6"
"r.Lumen.ScreenProbeGather.ShortRangeAO" = "0"
"r.Lumen.TranslucencyVolume.Enable" = "0"
"r.LumenScene.Radiosity.ProbeSpacing" = "8"
"r.Lumen.TraceMeshSDFs" = "0"
"r.Lumen.Reflections.Allow" = "0"
"r.LumenScene.SurfaceCache.CardCaptureRefreshFraction" = "0.0625"
"r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution" = "16"

[compat]
etat = "bronze"
source = "cidre-test"
date = "2026-10-16"
machine = "M1 Max 32 Go"
cidre_version = "1.5.11 + 0150"
fps_jeu = 30
notes = "DXMT, 1728x1084 : va en jeu (lobby et partie d'investigation), 30 a 55 fps, mais les pieces eclairees par des neons ou lampes emissives restent quasi noires. L'eclairage direct marche (tableaux sous spots bien eclaires) ; les emissifs n'eclairent leur entourage que par Lumen, qu'Unreal 5.6 n'active pas sur M1 (pas de Lumen en D3D11, ni en D3D12 sans SM 6.6 ni atomiques 64 bits). Sans contournement par Engine.ini : ombres coupees, MegaLights/clustered/culling/Lumen a 0, exposition fixe + SSGI n'eclairent pas les pieces. Avant 0150 (pont Steam), plantage au demarrage : SteamFriends018::GetFriendRelationship pris pour un retour par pointeur cache."
voie = "dxmt"

[[compat.machines]]
nom = "M1"
si = "famille_gpu <= 7"
voie = "d3d12"
etat = "argent"
source = "cidre-test"
date = "2026-10-18"
machine = "M1 Max 32 Go"
cidre_version = "1.5.15 + 0155 v2"
fps_menu = 27
fps_jeu = 0
options = "dx12=true sm66=true arguments=-dx12"
notes = "D3D12 + SM 6.6 : Lumen s'active (atomiques 64 bits emulees, 0153 ; barrieres de calcul, 0155) et les pieces aux neons sont eclairees. Avec Lumen allege par Engine.ini (pose par la fiche) : 26,9 fps au menu (meme cout que le jeu : 19,5 au menu, 18-19,5 en partie avec les reglages d'origine), GPU 37 ms, contre 19,9 avec les reglages Lumen du jeu ; en partie, a confirmer. Image propre (drawable relu en jeu). Le HUD Metal fige le D3D12 une partie sur deux : ne pas l'activer."

[[compat.machines]]
nom = "M2 et suivants"
si = "famille_gpu >= 8"
voie = "d3d12"
etat = "bronze"
source = "cidre-test"
date = "2026-10-16"
machine = "iMac M4 24 Go (10 coeurs GPU, ecran 2240x1260 points)"
cidre_version = "1.5.11"
fps_jeu = 18
options = "dx12=true sm66=true arguments=-dx12"
notes = "En SM 6.6, Lumen s'active : les pieces aux neons sont eclairees comme sur PC. Reglages du jeu par defaut en 2240x1260 : 8 fps / GPU 113 ms. Tout au minimum (l'Illumination globale ne descend pas sous Elevee, ce qui garde Lumen), 1600x900, FSR Ultra Performance : 18 fps / 55 ms. Avec en plus la generation d'images FSR 3 (elle marche sous vkd3d-proton/KosmicKrisp) : 32 fps affiches, environ 16 reels, latence d'entree accrue. Limite par la carte d'un M4 a 10 coeurs ; un M Pro/Max devrait faire mieux. Mesure sur M4 ; M2 et M3 non essayes."

