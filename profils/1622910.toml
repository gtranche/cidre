# Still Wakes the Deep -- fiche amorcee par tests/outils/importer_profils.py (2026-10-11).
# Chaque valeur importee porte sa source et sa date ([jeu.sources], ou `source`/`date`
# des blocs [compat.*]) ; une valeur sans provenance, cidre-test ou utilisateur n'est
# jamais ecrasee par l'import. Voir profils/README.md.

[jeu]
appid = 1622910
nom = "Still Wakes the Deep"
plateformes_steam = "windows"
moteur = "unreal"
moteur_nom = "Unreal Engine 5"
api = "d3d12"
api_disponibles = "d3d12"
bits = 64
drm = "steam"
# Steam lance ce binaire ; l'exe de la racine (StillWakesTheDeep.exe) est un
# amorceur qui cherche Habitat\Binaries\Win64\Habitat-Win64-Shipping.exe, absent
# de la version Steam (« CreateProcess() returned 2 », code 45, 2026-10-15).
exe = "Habitat/Binaries/Win64/StillWakesTheDeep.exe"

[jeu.sources]
nom = "steam 2026-10-11"
plateformes_steam = "steam 2026-10-11"
moteur = "pcgamingwiki 2026-10-11"
moteur_nom = "pcgamingwiki 2026-10-11"
api = "pcgamingwiki 2026-10-11"
api_disponibles = "pcgamingwiki 2026-10-11"
bits = "pcgamingwiki 2026-10-11"
drm = "pcgamingwiki 2026-10-11"

# Classe D3D12 seul par PCGW, mais le binaire a aussi le rendu D3D11 d'Unreal : avec
# -dx11 il tourne en DXMT (M1 Max, 2026-10-15), plus rapide que le D3D12 de
# vkd3d-proton sur KosmicKrisp (et Unreal 5 refuse le D3D12 sans SM 6.6 sur M1).
[cidre]
arguments = "-dx11"
dx12 = false

# Definition interne a 50 % : celle de la mesure (le jeu, apres son banc d'essai
# automatique, gardait ses reglages en Epique ; sg.* = 3 dans l'INI apres la partie).
# Le jeu tient la meme valeur a deux endroits : la section Scalability d'Unreal et
# celle de sa propre classe (Habitat).
[[reglages_jeu]]
id = "definition-50"
fichier = "AppData/Local/Habitat/Saved/Config/Windows/GameUserSettings.ini"
format = "ini"
section = "ScalabilityGroups"
valeurs = { "sg.ResolutionQuality" = "50" }

[[reglages_jeu]]
id = "definition-50-habitat"
fichier = "AppData/Local/Habitat/Saved/Config/Windows/GameUserSettings.ini"
format = "ini"
section = "/Script/Habitat.HabitatLocalSettings"
valeurs = { "CustomResolutionQuality" = "50.000000" }

[compat]
etat = "argent"
source = "cidre-test"
date = "2026-10-15"
machine = "M1 Max 32 Go"
fps_jeu = 50
notes = "Unreal 5 en D3D11 (arguments -dx11, DXMT) : le jeu demarre et tourne, affichage 1728x1084. En jeu, reglages Epique choisis par le jeu : 20 fps / 50 ms a 100 % de definition, 50 fps / 21 ms a 50 % (sg.ResolutionQuality=50 dans l'INI apres la partie). Lance par Habitat/Binaries/Win64/StillWakesTheDeep.exe (l'amorceur de la racine echoue). Image a confirmer."

[compat.protondb]
palier = "platinum"
