options_lancement_2 = "gamemodrun %command% (x1)"
options_lancement_3 = "STEAM_COMPAT_CONFIG=\"nativevulkanloader\" -force-d3d11 (x1)"
lanceur_secondaire = "non:1"
verdicts_recents = "yes:24 no:1"
rapports_export = 41
source = "protondb"
date = "2026-10-01"
url = "https://www.protondb.com/app/1622910"

[compat.pcgamingwiki]
fichiers_reglages = "AppData/Local/Habitat/Saved/Config/Windows/"
