# L'adresse publique, en HTTPS. A REMPLACER : le nom DNS declare chez Gandi
# (deux fois), la classe d'Ingress et l'emetteur de certificats de ton cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cidre-diag
  annotations:
    # cert-manager : le certificat Let's Encrypt (le nom de TON ClusterIssuer)
    cert-manager.io/cluster-issuer: letsencrypt
    # ingress-nginx : 8 Mio d'archive + l'enveloppe ; les archives ne sont pas mises en tampon sur disque
    nginx.ingress.kubernetes.io/proxy-body-size: "9m"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["diag.EXEMPLE.fr"]
      secretName: cidre-diag-tls
  rules:
    - host: diag.EXEMPLE.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: cidre-diag, port: { name: http } }
