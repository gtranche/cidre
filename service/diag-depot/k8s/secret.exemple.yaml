# NE PAS REMPLIR NI COMMITER CE FICHIER : il montre seulement la forme du Secret.
# Le creer a la main (README.md, etape 4) :
#   kubectl -n cidre-diag create secret generic cidre-diag-jetons \
#     --from-literal=JETON_APP="$(openssl rand -hex 24)" \
#     --from-literal=JETON_ADMIN="$(openssl rand -hex 24)"
apiVersion: v1
kind: Secret
metadata:
  name: cidre-diag-jetons
  namespace: cidre-diag
type: Opaque
stringData:
  JETON_APP: "a-remplir"
  JETON_ADMIN: "a-remplir"
