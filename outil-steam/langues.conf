# Jeux qui gardent leur langue dans un fichier de reglages a eux, plutot que de
# suivre la locale Windows ou de la demander a Steam. Format TAB-separe :
#
#   <appid> <TAB> <fichier> <TAB> <cle> <TAB> <code=valeur code=valeur ...>
#
#   fichier  relatif au dossier utilisateur du prefixe (drive_c/users/<user>/)
#   cle      la ligne `cle = valeur` (ou `cle=valeur`) a regler dans ce fichier
#   codes    la langue Cidre (option `langue` de profils.toml : fr, en, de, es,
#            it, pt, ru, pl, ja, ko, zh) -> la valeur que le jeu attend. Une
#            langue absente de la liste = le jeu ne l'a pas : on ne touche a rien.
#
# Lu par tests/langue_jeu.sh, que lancer_depuis_steam.sh appelle avant le jeu
# quand `langue` n'est pas « auto ». Seule la valeur de la cle est reecrite (ses
# guillemets, s'il y en a, sont gardes) ; le reste du fichier passe tel quel.
# Un jeu = une ligne.
#
# 552500 -- Warhammer: Vermintide 2. C'est son lanceur (launcher/Launcher.exe,
#   .NET) qui ecrit language_id d'apres la langue de Steam ; jeux.conf le
#   remplace par le jeu lui-meme, donc personne ne l'ecrit et le jeu reste en
#   « en ». Les valeurs sont celles du lanceur (ResourceDictionary.dll).
552500	AppData/Roaming/Fatshark/Vermintide 2/user_settings.config	language_id	en=en fr=fr de=de es=es it=it pt=br-pt ru=ru pl=pl zh=zh
