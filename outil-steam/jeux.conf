# Jeux dont Steam lance un « lanceur » que la pile ne sait pas faire tourner.
#
#   <appid>  <chemin de l'executable, relatif au dossier du jeu>
#
# Ce n'est pas un contournement : c'est exactement ce que le lanceur aurait
# fait. On note ici ce qu'il aurait demarre, parce qu'on ne peut pas le lui
# demander.
#
# 552500 -- Warhammer: Vermintide 2. Steam demande launcher/launcher.exe, un
#   binaire .NET « IL-only » : « mscoree.dll not found, IL-only binary
#   Launcher.exe cannot be loaded ». Notre pile desactive mscoree a dessein.
#   Le lanceur ne sert qu'a choisir entre DX11 et DX12 avant de demarrer le jeu.
552500   binaries/vermintide2.exe
