# Sauvegardes que Cidre copie lui-meme (dossier `cidre saves dossier`, sur ce Mac
# par defaut) : les jeux que Steam Cloud ne peut pas synchroniser sur macOS
# (Auto-Cloud declare pour Windows seulement), et les dossiers de sauvegardes
# locales des jeux a API Remote Storage (fiche : [compat.steam_cloud] synchro =
# "steam-api" ; Steam ne synchronise que ce que le jeu lui confie : la ligne
# designe ce qui reste en local). Un jeu dont le dossier est lie a celui que
# Steam synchronise (synchro = "steam-lien") n'est pas copie : sa ligne ne sert
# qu'a la copie de precaution de `cidre rm`. Format TAB-separe : appid <TAB> dossier de save
# (sous drive_c/users/<user>/). Le script sauvegarde tout le dossier SAUF le
# superflu (logs, cache, crash, dumps, screenshots, >100 Mo). Un jeu = une ligne.
# Un dossier prefixe par `jeu:` est pris dans le dossier du jeu lui-meme : certains
# jeux y rangent leurs sauvegardes, qu'une desinstallation emporterait.
# L'utilisateur ajoute ou corrige des lignes par `cidre saves set` (son fichier :
# ~/Library/Application Support/Cidre/saves.conf, meme format, prioritaire).
