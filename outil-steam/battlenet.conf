# Jeux Battle.net que Cidre sait lancer (tests/battlenet.sh). Format TAB-separe :
#   uid <TAB> code <TAB> executable <TAB> nom
# uid : l'identifiant du jeu chez l'Agent de Blizzard, celui de son
#   UninstallString (« --uid=osi ») et des cles Games de Battle.net.config.
# code : le code produit de `Battle.net.exe --exec="launch <code>"` (Lutris) ;
#   l'id Cidre du jeu est bnet-<code en minuscules> (bnet-osi), sa fiche
#   profils/bnet-<code>.toml.
# executable : le processus du jeu, que le lanceur attend (dans le dossier
#   d'installation que donne le registre du prefixe).
# Un jeu installe qui n'est pas ici apparait quand meme (id bnet-<uid>), sans
# pouvoir etre lance. Diablo III et World of Warcraft ont une version macOS :
# hors sujet.
osi	OSI	D2R.exe	Diablo II: Resurrected
fenris	Fen	Diablo IV.exe	Diablo IV
